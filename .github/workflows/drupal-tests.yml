# Reusable workflow: PHPUnit and Codeception tests for a Drupal module,
# theme or profile, on a bare GitHub runner.
#
# Call it from the extension's repository:
#
#   jobs:
#     tests:
#       uses: SU-SWS/stanford-caravan/.github/workflows/drupal-tests.yml@12.x
#       with:
#         codeception-shards: 4
#       secrets: inherit
#
# See config/.github/workflows/tests.yml for a full caller, and the README for
# every input.
#
# Code Quality runs phpcs (drupal/coder) and PHPStan. In warn mode, their
# findings are annotations and a job summary but don't fail the run.
#
# How it runs: setup-php installs PHP on the runner, MySQL and Selenium run as
# service containers, and PHP's built-in server serves the site. Each step
# calls a script in ci/, from a checkout of this repository at caravan-ref, and
# the test site installs stanford-caravan from that same checkout.
#
# codeception.yml's github_actions environment uses the hostnames "selenium"
# (the WebDriver host) and "drupal8ci" (the site URL the browser opens). The
# runner maps both in /etc/hosts, and Selenium maps "drupal8ci" back to the
# runner.
name: Drupal tests
on:
  workflow_call:
    inputs:
      php-versions:
        description: JSON list of PHP versions for PHPUnit, and for Codeception on release branches.
        type: string
        default: '["8.3", "8.4", "8.5"]'
      primary-php:
        description: PHP version for Codeception on other branches.
        type: string
        default: '8.4'
      release-branch-pattern:
        description: Bash glob for branches that run Codeception on every PHP version.
        type: string
        default: '*.x'
      phpunit:
        description: Run PHPUnit.
        type: boolean
        default: true
      coverage:
        description: Run PHPUnit with code coverage (Unit and Kernel tests only).
        type: boolean
        default: true
      coverage-required:
        description: Minimum line coverage percentage when coverage is on.
        type: number
        default: 90
      codeception-suites:
        description: JSON list of Codeception suites. '[]' skips Codeception.
        type: string
        default: '["acceptance", "functional"]'
      codeception-shards:
        description: Number of shards to split each Codeception suite into.
        type: number
        default: 1
      profile:
        description: Install profile for Codeception when testing a module or theme.
        type: string
        default: standard
      modules:
        description: Comma-separated extra modules to enable before Codeception runs.
        type: string
        default: ''
      test-dir:
        description: Codeception test directory, relative to the extension.
        type: string
        default: tests/codeception
      core-version:
        description: Drupal core version (e.g. 11, 11.3 or ^11). Empty means ^11.
        type: string
        default: ''
      phpcs:
        description: Drupal coding standards check. fail, warn (report without failing) or off.
        type: string
        default: warn
      phpstan:
        description: PHPStan analysis with phpstan-drupal and the deprecation rules. fail, warn or off.
        type: string
        default: warn
      phpstan-level:
        description: PHPStan rule level when the extension has no phpstan.neon.
        type: number
        default: 1
      caravan-ref:
        description: Ref of SU-SWS/stanford-caravan for the ci/ scripts, configs and Codeception modules. Keep it the same as the ref on the uses line.
        type: string
        default: 12.x
      mysql-image:
        type: string
        default: mysql:8.0
      selenium-image:
        type: string
        default: selenium/standalone-chrome:130.0
    secrets:
      STANFORD_ENCRYPT:
        description: Encryption key some extensions need for Codeception.
        required: false
permissions:
  contents: read
env:
  EXT_DIR: ${{ github.workspace }}/project
  CI_DIR: ${{ github.workspace }}/caravan/ci
  SITE_DIR: ${{ github.workspace }}/site
  CORE_VERSION: ${{ inputs.core-version }}
  DRUPAL_DATABASE_NAME: drupal
  DRUPAL_DATABASE_USERNAME: drupal
  DRUPAL_DATABASE_PASSWORD: drupal
  DRUPAL_DATABASE_HOST: 127.0.0.1
jobs:
  matrix:
    name: Test Matrix
    runs-on: ubuntu-24.04
    outputs:
      codeception-php: ${{ steps.set.outputs.codeception-php }}
      suites: ${{ steps.set.outputs.suites }}
      shards: ${{ steps.set.outputs.shards }}
    steps:
      - id: set
        env:
          PHP_VERSIONS: ${{ inputs.php-versions }}
          PRIMARY_PHP: ${{ inputs.primary-php }}
          PATTERN: ${{ inputs.release-branch-pattern }}
          SUITES: ${{ inputs.codeception-suites }}
          SHARDS: ${{ inputs.codeception-shards }}
          EVENT: ${{ github.event_name }}
          BRANCH: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          # Release branches and manual runs test every PHP version. Other
          # branches run Codeception on the primary version only.
          # shellcheck disable=SC2053 # PATTERN is a glob on purpose.
          if [ "$EVENT" = "workflow_dispatch" ] || { [ "$REF_TYPE" = "branch" ] && [[ $BRANCH == $PATTERN ]]; }; then
            php=$(jq -c . <<< "$PHP_VERSIONS")
          else
            php=$(jq -c -n --arg v "$PRIMARY_PHP" '[$v]')
          fi
          {
            echo "codeception-php=$php"
            echo "suites=$(jq -c . <<< "$SUITES")"
            echo "shards=$(seq 1 "$SHARDS" | jq -s -c .)"
          } | tee -a "$GITHUB_OUTPUT"

  phpunit:
    name: PHPUnit (${{ matrix.php }})
    if: inputs.phpunit
    strategy:
      fail-fast: false
      matrix:
        php: ${{ fromJSON(inputs.php-versions) }}
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: ${{ inputs.mysql-image }}
        env:
          MYSQL_DATABASE: drupal
          MYSQL_USER: drupal
          MYSQL_PASSWORD: drupal
          MYSQL_ROOT_PASSWORD: drupal
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v6
        with:
          path: project
      - uses: actions/checkout@v6
        with:
          repository: SU-SWS/stanford-caravan
          ref: ${{ inputs.caravan-ref }}
          path: caravan
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: gd, pdo_mysql, mysqli, zip, bz2, calendar, imagick
          coverage: ${{ inputs.coverage && 'pcov' || 'none' }}
          ini-values: memory_limit=-1
          tools: composer:v2
      - uses: actions/cache@v5
        with:
          path: ~/.cache/composer/files
          key: composer-${{ runner.os }}-php${{ matrix.php }}-${{ hashFiles('project/composer.json') }}
          restore-keys: composer-${{ runner.os }}-php${{ matrix.php }}-
      - name: Lint
        run: '"$CI_DIR/lint.sh" "$EXT_DIR"'
      - name: Build project
        run: '"$CI_DIR/build.sh" "$EXT_DIR" "$SITE_DIR"'
      - name: Run PHPUnit
        env:
          COVERAGE: ${{ inputs.coverage }}
          COVERAGE_REQUIRED: ${{ inputs.coverage-required }}
        run: |
          mysql -h 127.0.0.1 -u root -pdrupal -e 'SET GLOBAL max_allowed_packet=67108864;'
          "$CI_DIR/phpunit.sh" "$EXT_DIR" "$SITE_DIR"
      - name: Save test results
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: phpunit-php${{ matrix.php }}
          path: site/artifacts
          if-no-files-found: ignore

  code-quality:
    name: Code Quality
    if: inputs.phpcs != 'off' || inputs.phpstan != 'off'
    runs-on: ubuntu-24.04
    steps:
      - name: Check inputs
        env:
          PHPCS: ${{ inputs.phpcs }}
          PHPSTAN: ${{ inputs.phpstan }}
        run: |
          for value in "$PHPCS" "$PHPSTAN"; do
            case "$value" in
              fail|warn|off) ;;
              *) echo "::error::phpcs and phpstan take fail, warn or off, not '$value'."; exit 1 ;;
            esac
          done
      - uses: actions/checkout@v6
        with:
          path: project
      - uses: actions/checkout@v6
        with:
          repository: SU-SWS/stanford-caravan
          ref: ${{ inputs.caravan-ref }}
          path: caravan
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ inputs.primary-php }}
          extensions: gd, pdo_mysql, mysqli, zip, bz2, calendar, imagick
          coverage: none
          ini-values: memory_limit=-1
          tools: composer:v2
      - uses: actions/cache@v5
        with:
          path: ~/.cache/composer/files
          key: composer-${{ runner.os }}-php${{ inputs.primary-php }}-${{ hashFiles('project/composer.json') }}
          restore-keys: composer-${{ runner.os }}-php${{ inputs.primary-php }}-
      - name: PHPCS
        if: inputs.phpcs != 'off'
        env:
          MODE: ${{ inputs.phpcs }}
        run: '"$CI_DIR/phpcs.sh" "$EXT_DIR" "$RUNNER_TEMP/code-quality"'
      - name: Build project
        id: build
        # Runs even when PHPCS failed, so one run reports both tools.
        if: inputs.phpstan != 'off' && !cancelled()
        env:
          WITH_PHPSTAN: '1'
        run: '"$CI_DIR/build.sh" "$EXT_DIR" "$SITE_DIR"'
      - name: PHPStan
        if: inputs.phpstan != 'off' && !cancelled() && steps.build.outcome == 'success'
        env:
          MODE: ${{ inputs.phpstan }}
          PHPSTAN_LEVEL: ${{ inputs.phpstan-level }}
        run: '"$CI_DIR/phpstan.sh" "$EXT_DIR" "$SITE_DIR" "$RUNNER_TEMP/code-quality"'
      - name: Save reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: code-quality
          path: ${{ runner.temp }}/code-quality
          if-no-files-found: ignore

  codeception:
    name: Codeception (${{ matrix.suite }}, ${{ matrix.php }}, ${{ matrix.shard }})
    needs: [matrix]
    if: needs.matrix.outputs.suites != '[]'
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(needs.matrix.outputs.suites) }}
        php: ${{ fromJSON(needs.matrix.outputs.codeception-php) }}
        shard: ${{ fromJSON(needs.matrix.outputs.shards) }}
    runs-on: ubuntu-24.04
    services:
      selenium:
        # Only the functional suite uses WebDriver. An empty image skips the service.
        image: ${{ matrix.suite == 'functional' && inputs.selenium-image || '' }}
        ports:
          - 4444:4444
        options: >-
          --shm-size=2g
          --add-host=drupal8ci:host-gateway
      mysql:
        image: ${{ inputs.mysql-image }}
        env:
          MYSQL_DATABASE: drupal
          MYSQL_USER: drupal
          MYSQL_PASSWORD: drupal
          MYSQL_ROOT_PASSWORD: drupal
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v6
        with:
          path: project
      - uses: actions/checkout@v6
        with:
          repository: SU-SWS/stanford-caravan
          ref: ${{ inputs.caravan-ref }}
          path: caravan
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: gd, pdo_mysql, mysqli, zip, bz2, calendar, imagick
          coverage: none
          ini-values: memory_limit=-1
          tools: composer:v2
      - uses: actions/cache@v5
        with:
          path: ~/.cache/composer/files
          key: composer-${{ runner.os }}-php${{ matrix.php }}-${{ hashFiles('project/composer.json') }}
          restore-keys: composer-${{ runner.os }}-php${{ matrix.php }}-
      - name: Build project
        env:
          WITH_CODECEPTION: '1'
        run: '"$CI_DIR/build.sh" "$EXT_DIR" "$SITE_DIR"'
      - name: Install Drupal
        env:
          PROFILE: ${{ inputs.profile }}
          MODULES: ${{ inputs.modules }}
        run: |
          mysql -h 127.0.0.1 -u root -pdrupal -e 'SET GLOBAL max_allowed_packet=67108864;'
          "$CI_DIR/install.sh" "$EXT_DIR" "$SITE_DIR"
      - name: Start web server
        run: |
          echo "127.0.0.1 selenium drupal8ci" | sudo tee -a /etc/hosts
          # Serve on port 80 as the runner user, so the web server and drush
          # own the same files.
          sudo sysctl -q net.ipv4.ip_unprivileged_port_start=80
          cd "$SITE_DIR/web"
          PHP_CLI_SERVER_WORKERS=8 nohup php -S 0.0.0.0:80 .ht.router.php \
            > "$SITE_DIR/artifacts/php-server.log" 2>&1 &
          curl -sS -o /dev/null -w 'Front page: %{http_code}\n' --retry 5 --retry-connrefused http://localhost/
      - name: Run Codeception
        env:
          STANFORD_ENCRYPT: ${{ secrets.STANFORD_ENCRYPT }}
          SUITES: ${{ matrix.suite }}
          SHARD: ${{ matrix.shard }}/${{ inputs.codeception-shards }}
          TEST_DIR: ${{ inputs.test-dir }}
        run: '"$CI_DIR/codeception.sh" "$EXT_DIR" "$SITE_DIR"'
      - name: Save test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: codeception-${{ matrix.suite }}-php${{ matrix.php }}-${{ matrix.shard }}
          path: site/artifacts
          if-no-files-found: ignore

  result:
    # Fails unless every job succeeded or was turned off by an input, so a
    # skipped or cancelled job can never look like a pass.
    name: Test Results
    if: always()
    needs: [matrix, phpunit, code-quality, codeception]
    runs-on: ubuntu-24.04
    steps:
      - env:
          MATRIX: ${{ needs.matrix.result }}
          PHPUNIT: ${{ needs.phpunit.result }}
          PHPUNIT_ON: ${{ inputs.phpunit }}
          QUALITY: ${{ needs.code-quality.result }}
          QUALITY_ON: ${{ inputs.phpcs != 'off' || inputs.phpstan != 'off' }}
          CODECEPTION: ${{ needs.codeception.result }}
          CODECEPTION_ON: ${{ needs.matrix.outputs.suites != '[]' }}
        run: |
          echo "matrix=$MATRIX phpunit=$PHPUNIT code-quality=$QUALITY codeception=$CODECEPTION"
          ok() { [ "$1" = "success" ] || { [ "$1" = "skipped" ] && [ "$2" = "false" ]; }; }
          ok "$MATRIX" true && ok "$PHPUNIT" "$PHPUNIT_ON" && ok "$QUALITY" "$QUALITY_ON" \
            && ok "$CODECEPTION" "$CODECEPTION_ON"

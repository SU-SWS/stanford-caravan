paths:
  tests: tests
  output: artifacts
  data: tests/_data
  support: tests/_support
  envs: tests/_envs
actor_suffix: Tester
settings:
  shuffle: true
extensions:
  enabled:
    - Codeception\Extension\RunFailed
modules:
  enabled:
    - Codeception\Module\Asserts
    - StanfordCaravan\Codeception\Drupal\DrupalBootstrap:
        root: '/var/www/html/docroot'
        server:
          HTTP_HOST: 'localhost'
    - StanfordCaravan\Codeception\Drupal\DrupalDrush:
        drush: '/var/www/html/vendor/bin/drush'
        options:
          uri: 'localhost'
    - PhpBrowser:
        url: 'http://localhost/'
    - WebDriver:
        wait: 1
        log_js_errors: true
        debug_log_entries: 10
        browser: chrome
        restart: true
        url: 'http://localhost/'
    - StanfordCaravan\Codeception\Drupal\DrupalEntity:
        cleanup_test: true
        cleanup_failed: false
        cleanup_suite: true
        route_entities:
          - node
          - taxonomy_term
          - media
    - StanfordCaravan\Codeception\Drupal\DrupalUser:
        drush: '/var/www/html/vendor/bin/drush'
        default_role: 'authenticated'
        driver: 'WebDriver'
        cleanup_entities:
          - node
          - media
          - file
        cleanup_test: true
        cleanup_failed: false
        cleanup_suite: true
env:
  ci: {  }
  github_actions:
    modules:
      config:
        WebDriver:
          url: 'http://drupal8ci/'
          browser: chrome
          host: selenium
          port: 4444
          capabilities:
            goog:chromeOptions:
              # The site is served over plain http, so Chrome would not treat it
              # as a secure context and APIs such as crypto.subtle would be
              # missing (Editoria11y needs it). Real sites use https.
              args:
                - '--unsafely-treat-insecure-origin-as-secure=http://drupal8ci'
  firefix:
    modules:
      config:
        WebDriver:
          browser: firefix

# Copy to .github/workflows/tests.yml in a module, theme or profile repository.
# The tests themselves run in the shared workflow; see "GitHub Actions" in the
# stanford-caravan README for its inputs.
name: Tests
on:
  push:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Let every push to a release branch finish, so each merge gets a result.
  cancel-in-progress: ${{ !endsWith(github.ref, '.x') }}
permissions:
  contents: read
jobs:
  tests:
    name: Tests
    uses: SU-SWS/stanford-caravan/.github/workflows/drupal-tests.yml@11.x
    with:
      # '[]' turns Codeception off, for extensions without Codeception tests.
      codeception-suites: '["acceptance", "functional"]'
      codeception-shards: 1
    secrets: inherit

  # Make this the required status check. Its name stays the same whatever the
  # shared workflow's jobs are called.
  all-tests-pass:
    name: All Tests Pass
    if: always()
    needs: [tests]
    runs-on: ubuntu-24.04
    steps:
      - env:
          RESULT: ${{ needs.tests.result }}
        run: |
          echo "Tests: $RESULT"
          [ "$RESULT" = "success" ]
